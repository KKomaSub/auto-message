name: Auto Unzip and Inject Workflow

on:
  push:
    paths:
      - '*.zip'

# [추가 1] 동일한 브랜치에서 워크플로우가 동시에 실행되어 충돌하는 것을 방지합니다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  unzip-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0 # 전체 히스토리를 가져와 rebase 충돌 방지

      - name: Process ZIP and Inject Workflow
        run: |
          ZIP_FILE=$(ls *.zip | head -n 1)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "No zip file found."
            exit 0
          fi
          
          echo "Found zip file: $ZIP_FILE"
          mkdir -p ./tmp_unzip
          unzip -o -q "$ZIP_FILE" -d ./tmp_unzip
          
          TARGET_DIR=$(find ./tmp_unzip -type d -path "*/.github/workflows" | head -n 1)
          
          if [ -n "$TARGET_DIR" ]; then
            echo "Target workflow directory found inside ZIP: $TARGET_DIR"
            cat << 'EOF' > "$TARGET_DIR/inserted-ci.yml"
          name: Inserted Action
          on: [push]
          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - run: echo "This workflow was injected from the zip file!"
          EOF
            echo "Successfully injected inserted-ci.yml into ZIP structure."
          else
            echo "Warning: .github/workflows directory not found inside the ZIP structure."
          fi
          
          cp -r ./tmp_unzip/* ./
          rm -rf ./tmp_unzip
          rm "$ZIP_FILE"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add .
          
          if ! git diff --staged --quiet; then
            git commit -m "chore: ZIP 압축 해제 및 .github/workflows 파일 주입 완료"
            # [추가 2] 푸시 직전 원격 저장소의 최신 커밋을 받아와 병합합니다.
            git pull --rebase origin ${{ github.ref_name }}
            git push
          else
            echo "No changes to commit"
          fi
